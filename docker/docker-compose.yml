# docker-compose.yml — Single-container deployment for p2pstud anchor node.
#
# Defaults to a lightweight storage-only anchor (no domain or TLS certs needed).
# Uses the public Iroh EU relay for seamless NAT traversal on any cheap VPS.
#
# Usage:
#   docker compose up -d
#
# To view your anchor's public Node ID:
#   docker compose logs | grep "Node identity loaded"

version: "3.9"

services:
  p2pstud:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: p2pstud:latest
    container_name: p2pstud-anchor
    restart: unless-stopped

    # host networking gives best QUIC/UDP performance and avoids double NAT.
    network_mode: host

    volumes:
      - p2pstud_data:/var/lib/p2pstud
      # Uncomment if running a custom TLS relay with a domain name:
      # - /etc/letsencrypt:/etc/letsencrypt:ro

    env_file:
      - path: .env
        required: false

    # Default command: zero-domain, lightweight anchor with public relay fallback.
    command: ${ANCHOR_ARGS:---data-dir /var/lib/p2pstud --no-relay}

volumes:
  p2pstud_data:
    driver: local

