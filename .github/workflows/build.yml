name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel in-progress runs of the same workflow if a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'windows-x86_64'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            name: 'linux-x86_64'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'macos-latest'
            name: 'macos-arm64'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache cargo dependencies to cut compile times drastically (uses free Actions cache)
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Headless Anchor Binary
        run: cargo build --release --bin anchor

      - name: Build Tauri Desktop Client
        run: npx tauri build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p2pstud-${{ matrix.name }}
          path: |
            target/release/bundle/
            src-tauri/target/release/bundle/
            target/release/anchor
            target/release/anchor.exe
            src-tauri/target/release/anchor
            src-tauri/target/release/anchor.exe
          if-no-files-found: warn

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PKG_VER=$(node -p "require('./package.json').version")
            echo "tag=v${PKG_VER}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Release on Tag or Dispatch
        uses: softprops/action-gh-release@v2
        if: steps.release_tag.outputs.should_release == 'true'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.tar.gz
            target/release/anchor
            target/release/anchor.exe
            src-tauri/target/release/anchor
            src-tauri/target/release/anchor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
