version: 2
updates:
  # Root Cargo workspace lockfile & manifests
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # Tauri workspace crate
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"

  # Frontend npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

