version: 2
updates:
  # Root Cargo workspace lockfile & manifests (covers root Cargo.toml, Cargo.lock, and src-tauri workspace member)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # Frontend npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

