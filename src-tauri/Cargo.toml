[package]
name = "p2pstud-tauri"
version = "0.1.23"
edition = "2021"
rust-version = "1.77"
default-run = "p2pstud"

[[bin]]
name = "p2pstud"
path = "src/main.rs"

[[bin]]
name = "anchor"
path = "src/bin/anchor.rs"

[lib]
name = "p2pstud_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
# tauri-plugin-dialog removed (not required)
tauri-plugin-fs    = "2"

# ZIP archive import (dev mode)
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

# P2P networking
iroh           = "1.4"
iroh-blobs     = "0.104"
iroh-relay     = { version = "1.4", features = ["server"] }
iroh-tickets   = "1.0"

# Async runtime
tokio          = { version = "1", features = ["full"] }

# Local storage
rusqlite       = { version = "0.31", features = ["bundled"] }

# Serialisation
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
chrono         = { version = "0.4", features = ["serde", "clock"] }
url            = "2"
semver         = "1.0"

# HTTP client for GitHub releases updater
reqwest        = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Error handling
anyhow         = "1"
thiserror      = "2"

# Platform dirs
dirs           = "7"

# Logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# Utilities
bytes          = "1"
rand           = "0.10"
nonzero_ext    = "0.3"
unicode-normalization = "0.1"

# CLI (anchor binary only)
clap = { version = "4", features = ["derive"] }

# Rate limiting
governor = "0.7"
tauri-plugin-autostart = "2.0.0-rc.1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
tempfile    = "3"
tokio-test  = "0.4"

[features]
# Enables network integration tests (require two running Iroh nodes)
integration = []


